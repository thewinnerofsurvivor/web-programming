<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>addEventListener</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }

    #count-btn {
      background: #10B981;
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    #count-display {
      font-size: 3rem;
      font-weight: bold;
      color: #15803d;
    }

    input {
      padding: 8px;
      border: 2px solid #10B981;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <button id="count-btn">Click me!</button>
  <p id="count-display">0</p>

  <input id="name" type="text" placeholder="Type your name...">
  <p>Hello, <span id="mirror">...</span></p>

  <script>
    // 'click' event
    let count = 0;
    const btn = document.querySelector('#count-btn');

    btn.addEventListener('click', () => {
      count++;
      document.querySelector('#count-display').textContent = count;
    });

    // 'input' event — fires every time the value changes
    const inp = document.querySelector('#name');

    inp.addEventListener('input', () => {
      document.querySelector('#mirror').textContent = inp.value;
    });
  </script>
</body>
</html>
