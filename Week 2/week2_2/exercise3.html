<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Figures</title>
</head>

<body>
    <!-- Figure 1: image with figcaption -->
    <figure>
        <img src="https://picsum.photos/400/250?random=10" alt="A randomly selected scenic photograph">
        <figcaption>A scenic photograph from Lorem Picsum.</figcaption>
    </figure>

    <!-- Sentence with time element -->
    <p>Today's date is <time datetime="2026-09-05">September 5, 2026</time>.</p>

    <!-- Figure 2: pre+code block with figcaption -->
    <figure>
        <pre><code>&lt;!DOCTYPE html&gt;
&lt;html lang="en"&gt;
&lt;head&gt;&lt;meta charset="UTF-8"&gt;&lt;title&gt;Figures&lt;/title&gt;&lt;/head&gt;
&lt;body&gt;
  &lt;!-- Figure 1: image with figcaption --&gt;
  &lt;figure&gt;&lt;/figure&gt;
&lt;/body&gt;
&lt;/html&gt;</code></pre>
        <figcaption>The HTML skeleton used for this page.</figcaption>
    </figure>
</body>

</html>
