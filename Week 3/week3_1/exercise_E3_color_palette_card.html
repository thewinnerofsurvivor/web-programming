<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    .palette {
      display: flex;
      gap: 12px;
      /* TODO: add padding and a light background */
      padding: 10px;
      background-color: lightskyblue;
    }
    .swatch {
      /* TODO: set width: 100px, height: 100px, border-radius: 8px */
      /* TODO: center the text using display:flex, align-items, justify-content */
      color: white;
      font-weight: bold;
      font-size: 13px;
      font-family: monospace;
      width: 100px;
      height: 100px;
      border-radius: 8px;
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }
    /* TODO: add 5 colour classes: .c1 through .c5 */
    /* Use: #EF4444  #F59E0B  #10B981  #3B82F6  #8B5CF6 */

    .swatch.c1 {
        background-color: #EF4444;
    }

    .swatch.c2 {
        background-color: #F59E0B;
    }

    .swatch.c3 {
        background-color: #10B981;
    }

    .swatch.c4 {
        background-color: #3B82F6;
    }

    .swatch.c5 {
        background-color: #8B5CF6;
    }
  </style>
</head>
<body>
  <div class="palette">
    <div class="swatch c1">#EF4444</div>
    <div class="swatch c2">#F59E0B</div>
    <div class="swatch c3">#10B981</div>
    <div class="swatch c4">#3B82F6</div>
    <div class="swatch c5">#8B5CF6</div>
  </div>
</body>
</html>
